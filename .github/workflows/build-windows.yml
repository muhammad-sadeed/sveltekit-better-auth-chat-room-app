name: Build Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (for example: v1.2.3). If empty on manual runs, a tag is auto-generated.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || (github.event_name == 'workflow_dispatch' && (inputs.release_tag || format('win-build-{0}', github.run_id))) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build Windows installers
        run: bunx electron-builder --win --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist-electron/*.exe
          if-no-files-found: error

      - name: Validate release tag format
        if: ${{ env.RELEASE_TAG != '' }}
        shell: pwsh
        run: |
          git check-ref-format "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Invalid release tag '$env:RELEASE_TAG'. Release creation will be skipped."
            "RELEASE_TAG=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Create release and upload EXEs
        if: ${{ env.RELEASE_TAG != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: dist-electron/*.exe
          generate_release_notes: true

      - name: Skip release when no tag is provided
        if: ${{ env.RELEASE_TAG == '' }}
        run: echo "No release tag applies for this event. Build artifacts were uploaded, and release creation was skipped."
