name: Build Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Auto-update only works when the release tag matches the version that
      # electron-builder stamps into latest.yml, so releases are keyed by the
      # package.json version. Bump the version to ship an update.
      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"

          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tag) {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version. Bump the version or rename the tag."
          }

          # A tag existing does not mean a release exists (tag pushes are the
          # normal way to release), so ask GitHub about the release itself.
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists - publish step will be skipped."
            "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Windows installers
        run: bunx electron-builder --win --publish never

      # electron-updater reads this manifest to discover the next version. If it
      # is missing, the publish config was lost and auto-update would silently
      # stop working, so fail loudly here instead.
      - name: Verify update manifest
        shell: pwsh
        run: |
          $manifest = Get-ChildItem -Path dist-electron -Filter 'latest*.yml'
          if (-not $manifest) {
            throw "electron-builder did not produce an update manifest (latest.yml). Check the publish config in package.json."
          }
          Get-ChildItem -Path dist-electron | Select-Object Name, Length | Format-Table

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist-electron/*.exe
            dist-electron/latest*.yml
            dist-electron/*.blockmap
          if-no-files-found: error

      - name: Create release and upload installers
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          # latest.yml + .blockmap are what electron-updater consumes; the .exe is
          # what a first-time install uses.
          files: |
            dist-electron/*.exe
            dist-electron/latest*.yml
            dist-electron/*.blockmap
          make_latest: true
          generate_release_notes: true

      - name: Skip release when version was not bumped
        if: ${{ steps.release.outputs.publish != 'true' }}
        run: echo "Release ${{ steps.release.outputs.tag }} already exists. Artifacts were uploaded, release creation was skipped."
